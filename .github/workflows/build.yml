name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (iOS Simulator - 验证编译)
        run: |
          xcodebuild build \
            -project CreamMusic.xcodeproj \
            -scheme CreamMusic \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Build (iOS Device - 生成 IPA)
        run: |
          xcodebuild build \
            -project CreamMusic.xcodeproj \
            -scheme CreamMusic \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Package IPA
        run: |
          APP_PATH=$(find build/Build/Products -name "CreamMusic.app" -type d | head -1)
          echo "App found at: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r 奶油音乐.ipa Payload
          ls -lh 奶油音乐.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 奶油音乐-IPA
          path: 奶油音乐.ipa
          retention-days: 30
